
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

input_boolean:
  varme:
    name: Varme on/off

input_number:
  # No "initial:" - omitting it lets HA restore the last value after a restart.
  tv_stue_temp:
    name: TV Stue temp
    min: 17
    max: 28
    step: 0.5

  spisestue_temp:
    name: Spisestue temp
    min: 18
    max: 28
    step: 0.5


automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
